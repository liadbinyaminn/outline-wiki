services:
  outline:
    image: outlinewiki/outline:1.10.1
    env_file: 
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
    ports:
      - "127.0.0.1:3000:3000"  
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/_health | grep -q OK || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER: ${POSTGRES_USER}
      - POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      - POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - backend

  redis:
    image: redis:8
    volumes:
      - ./redis-data:/data
    restart: always
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.30.5-alpine # Latest stable version
    ports:
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - outline
    restart: always
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true